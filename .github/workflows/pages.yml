name: Publish landing page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble and push the site to gh-pages
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/site"
          cp index.html robots.txt sitemap.xml README.md "$RUNNER_TEMP/site/"
          touch "$RUNNER_TEMP/site/.nojekyll"
          if [ -f CNAME ]; then cp CNAME "$RUNNER_TEMP/site/"; fi

          cd "$RUNNER_TEMP/site"
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA:0:7}"
          git push -q -f \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
